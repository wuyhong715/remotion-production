name: Render video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: Remotion composition ID
        required: true
        default: Demo
        type: string
      shards:
        description: Video shard count (1-15; audio is one additional job)
        required: true
        default: '4'
        type: string

# Free standard hosted runners allow 20 concurrent jobs. One production run
# uses at most 15 video jobs + 1 full-length audio job = 16 render jobs.
# A fixed group is intentional: Actions has no cross-workflow 16-slot semaphore.
# queue:max keeps later runs waiting instead of replacing the pending run.
concurrency:
  group: remotion-production-render
  queue: max

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  prepare:
    name: Prepare bundle and manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      package_name: render-package-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Build and plan
        id: plan
        env:
          COMPOSITION: ${{ inputs.composition }}
          SHARDS: ${{ inputs.shards }}
          RENDER_PACKAGE: out/package
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run prepare-render
      - name: Upload immutable render package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: render-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/package
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  video:
    name: Video shard ${{ matrix.id }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - name: Download this run's package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.prepare.outputs.package_name }}
          path: out/package
      - name: Render one silent video shard
        env:
          CHUNK_ID: ${{ matrix.id }}
          RENDER_PACKAGE: out/package
          RENDER_PARTS: out/artifacts
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run render-video
      - name: Upload video shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: render-part-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          compression-level: 0
          path: out/artifacts/chunk-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  audio:
    name: Full timeline audio
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Ensure Remotion browser
        run: npx remotion browser ensure
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.prepare.outputs.package_name }}
          path: out/package
      - name: Render complete PCM audio track
        env:
          RENDER_PACKAGE: out/package
          RENDER_PARTS: out/artifacts
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run render-audio
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: render-part-${{ github.run_id }}-${{ github.run_attempt }}-audio
          compression-level: 1
          path: out/artifacts/audio
          if-no-files-found: error
          retention-days: 1
          overwrite: false

  assemble:
    name: Verify and assemble MP4
    needs: [prepare, video, audio]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Check FFmpeg availability
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.prepare.outputs.package_name }}
          path: out/package
      - name: Download render parts into separate directories
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: render-part-${{ github.run_id }}-*
          path: out/downloads
          merge-multiple: false
          digest-mismatch: error
      - name: Verify artifact identities and place parts
        run: node scripts/actions-parts.mjs
      - name: Assemble and verify
        env:
          RENDER_PACKAGE: out/package
          RENDER_PARTS: out/artifacts
          RENDER_OUTPUT: out/final
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: npm run assemble
      - name: Upload final MP4 and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: remotion-${{ inputs.composition }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/final
          if-no-files-found: error
          retention-days: 14
          overwrite: false
